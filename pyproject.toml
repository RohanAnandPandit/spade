[project]
name = "spade"
version = "0.1.0"
description = "SPARQL Analysis and Data Explorer"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "country-converter>=1.3.2",
    "email-validator>=2.2,<3",
    "fastapi>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20,<1",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.7",
]
migration = [
    "compress-pickle>=2.1,<3",
    "pymongo>=4.18,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["backend/tests"]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["B008"] # FastAPI dependencies are intentionally declared as defaults.

[tool.ruff.format]
quote-style = "double"
