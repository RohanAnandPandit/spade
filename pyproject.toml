[project]
name = "spade"
version = "0.1.0"
description = "SPARQL Analysis and Data Explorer"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "compress-pickle>=2.1.0",
    "country-converter>=1.3.2",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "gunicorn>=26.2.0",
    "pymongo>=4.18.1",
    "python-dotenv>=1.2.3",
    "rdflib>=7.6.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["backend/tests"]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
