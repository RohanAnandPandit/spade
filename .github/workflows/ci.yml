name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check backend app.py
      - name: Lint
        run: uv run ruff check backend app.py
      - name: Test
        run: uv run pytest --cov=backend --cov-report=term-missing
      - name: Audit dependencies
        run: |
          uv export --quiet --locked --no-group dev --no-emit-project --output-file /tmp/spade-requirements.txt
          uv run pip-audit --requirement /tmp/spade-requirements.txt

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 12.4.1
          runtime: node@24
          cache: true
          install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
